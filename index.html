<meta name="theme-color" content="#c9a84c"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070a;--surface:#0f0f12;--border:#1e1e24;--border2:#2a2a32;
  --gold:#c9a84c;--gold-dim:#6b5520;--amber:#f59e0b;
  --text:#e8e6e0;--muted:#5a5854;--muted2:#8a8680;
  --green:#4ade80;--red:#f87171;
  --fd:'Playfair Display',Georgia,serif;
  --fu:'Inter',system-ui,sans-serif;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--fu);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pillIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* LANDING */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;text-align:center;padding:40px 20px}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%)}
.glow{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;background:radial-gradient(ellipse,rgba(201,168,76,.07) 0%,transparent 68%);pointer-events:none}
.inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;animation:fadeUp .8s ease both}
.emblem{width:84px;height:84px;border:1px solid rgba(201,168,76,.25);display:flex;align-items:center;justify-content:center;margin-bottom:28px;position:relative}
.emblem::before{content:'';position:absolute;inset:-1px;border:1px solid transparent;border-top-color:var(--gold);animation:spin 3s linear infinite}
.emblem-in{width:66px;height:66px;border:1px solid rgba(201,168,76,.12);display:flex;align-items:center;justify-content:center}
.sigla{font-family:var(--fd);font-size:20px;font-weight:600;color:var(--gold);letter-spacing:3px}
.wordmark{font-family:var(--fd);font-size:clamp(52px,9vw,88px);font-weight:500;letter-spacing:-2px;line-height:.95;color:var(--text)}
.wordmark span{color:var(--gold);font-style:italic}
.slogan{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--muted2);margin-top:16px}
.slogan strong{color:var(--gold);font-weight:700}
.orn{display:flex;align-items:center;gap:16px;width:300px;margin:36px 0}
.orn-l,.orn-r{flex:1;height:1px}
.orn-l{background:linear-gradient(90deg,transparent,var(--gold-dim))}
.orn-r{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.orn-d{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 10px var(--gold)}
.nets{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:540px;margin-bottom:16px}
.net-pill{display:inline-flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:6px 12px;border:1px solid var(--border2);color:var(--muted);font-weight:700;transition:all .2s;animation:pillIn .5s ease both}
.lang-bar{display:flex;gap:8px;margin-bottom:36px}
.lang-btn{padding:6px 14px;background:transparent;border:1px solid var(--border2);color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:700;cursor:pointer;transition:all .2s;font-family:var(--fu)}
.lang-btn:hover,.lang-btn.active{border-color:var(--gold-dim);color:var(--gold);background:rgba(201,168,76,.05)}
.ctas{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:32px}
.btn-cta{display:inline-flex;align-items:center;gap:10px;padding:18px 52px;background:var(--gold);color:#07070a;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;border:none;cursor:pointer;transition:all .25s;font-family:var(--fu)}
.btn-cta:hover{background:var(--amber);transform:translateY(-2px);box-shadow:0 14px 40px rgba(201,168,76,.3)}
.btn-outline{padding:10px 28px;background:transparent;border:1px solid var(--border2);color:var(--muted2);font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;font-family:var(--fu)}
.btn-outline:hover{border-color:var(--gold-dim);color:var(--gold)}
.lfoot{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:32px;z-index:2}
.lfoot span{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);opacity:.4}

/* PLANS */
.plans-page{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:70px 20px 60px;position:relative;overflow:hidden;animation:fadeUp .5s ease both}
.back-btn{position:absolute;top:24px;left:28px;background:transparent;border:1px solid var(--border2);color:var(--muted2);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 16px;cursor:pointer;font-family:var(--fu);transition:all .2s}
.back-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.plans-title{font-family:var(--fd);font-size:clamp(36px,5vw,52px);font-weight:500;color:var(--text);letter-spacing:-1px;margin-bottom:6px;text-align:center}
.plans-title em{color:var(--gold);font-style:italic}
.plans-sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
.billing{display:flex;border:1px solid var(--border2);margin-bottom:40px}
.bill-btn{padding:10px 28px;background:transparent;border:none;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;font-family:var(--fu);transition:all .2s}
.bill-btn.active{background:var(--gold);color:#07070a}
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);max-width:860px;width:100%;border:1px solid var(--border)}
@media(max-width:700px){.plans-grid{grid-template-columns:1fr}}
.plan-card{background:var(--surface);padding:28px 22px;display:flex;flex-direction:column;position:relative}
.plan-card.hi{background:#0c0c0e}
.plan-badge{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--gold);color:#07070a;font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:4px 14px;white-space:nowrap}
.plan-name{font-family:var(--fd);font-size:24px;font-weight:500;color:var(--text);margin-bottom:2px}
.plan-card.hi .plan-name{color:var(--gold)}
.plan-desc{font-size:11px;color:var(--muted);margin-bottom:20px}
.plan-price{font-family:var(--fd);font-size:40px;font-weight:400;color:var(--text);line-height:1;margin-bottom:4px}
.plan-price-sub{font-size:11px;color:var(--muted);margin-bottom:18px}
.plan-div{height:1px;background:var(--border);margin-bottom:14px}
.plan-feats{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:20px;flex:1}
.plan-feat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted2)}
.feat-chk{width:13px;height:13px;flex-shrink:0;border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--gold)}
.pay-btns{display:flex;flex-direction:column;gap:6px}
.plan-cta{padding:11px;border:none;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;width:100%;font-family:var(--fu);transition:all .2s}
.cta-stripe{background:var(--gold);color:#07070a}
.cta-stripe:hover{background:var(--amber)}
.cta-mp{background:transparent;border:1px solid #00b1ea;color:#00b1ea}
.cta-mp:hover{background:rgba(0,177,234,.1)}

/* AUTH */
.auth-page{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .4s ease both}
.auth-box{width:100%;max-width:400px}
.auth-card{background:var(--surface);border:1px solid var(--border);padding:32px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-wordmark{font-family:var(--fd);font-size:30px;font-weight:500;color:var(--text)}
.auth-wordmark span{color:var(--gold);font-style:italic}
.auth-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.auth-title{font-family:var(--fd);font-size:22px;font-weight:500;color:var(--text);margin-bottom:20px}
.auth-error{background:rgba(248,113,113,.08);border-left:2px solid var(--red);padding:10px 14px;margin-bottom:16px;font-size:12px;color:#fca5a5}
.auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:10px;letter-spacing:1px;color:var(--muted)}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-toggle{text-align:center;margin-top:20px;font-size:11px;color:var(--gold);cursor:pointer}
.auth-back{text-align:center;margin-top:14px;font-size:10px;color:var(--muted);cursor:pointer}

/* APP SHELL */
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:50;padding:28px 0}
.sb-logo{padding:0 24px 24px;border-bottom:1px solid var(--border)}
.sb-mark{font-family:var(--fd);font-size:22px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:9px;line-height:1}
.sb-dot{width:7px;height:7px;background:var(--gold);border-radius:50%;box-shadow:0 0 10px var(--gold);flex-shrink:0}
.sb-sub{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:5px;padding-left:16px}
.nav-list{padding:18px 0;list-style:none;flex:1}
.nav-item{position:relative}
.nav-btn{width:100%;display:flex;align-items:center;gap:11px;padding:10px 24px;background:none;border:none;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.5px;cursor:pointer;transition:color .2s;text-align:left;font-family:var(--fu)}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--gold)}
.nav-bar{position:absolute;right:0;top:50%;transform:translateY(-50%);width:2px;height:16px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.sb-foot{padding:16px 24px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.lang-foot{display:flex;gap:4px}
.lf-btn{padding:4px 8px;background:transparent;border:1px solid transparent;color:var(--muted);font-size:9px;letter-spacing:1.5px;font-weight:700;cursor:pointer;transition:all .15s;font-family:var(--fu)}
.lf-btn:hover,.lf-btn.active{border-color:var(--gold-dim);color:var(--gold)}
.main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
@media(max-width:800px){
  .sidebar{display:none}
  .main{margin-left:0}
  .content{padding:16px}
  .topbar{padding:16px 16px 12px}
  .cg{grid-template-columns:1fr}
  .cg-side{display:none}
  .plans-grid{grid-template-columns:1fr}
  .cred-fields{grid-template-columns:1fr}
}
/* BOTTOM NAV MOBILE */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
@media(max-width:800px){.bottom-nav{display:flex}}
.bottom-nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 16px;background:transparent;border:none;cursor:pointer;font-family:var(--fu);transition:all .2s;min-width:60px}
.bottom-nav-btn span:first-child{font-size:18px;line-height:1}
.bottom-nav-btn span:last-child{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.bottom-nav-btn.active span:last-child{color:var(--gold)}
.bottom-nav-btn.active span:first-child{filter:drop-shadow(0 0 4px var(--gold))}
/* Espaço para bottom nav no mobile */
@media(max-width:800px){.content{padding-bottom:80px}}
.topbar{padding:24px 40px 16px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border)}
.page-title{font-family:var(--fd);font-size:28px;font-weight:500;letter-spacing:-.5px;line-height:1}
.page-title em{font-style:italic;color:var(--gold)}
.page-date{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.home-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;cursor:pointer;font-family:var(--fu)}
.content{padding:32px 40px;flex:1;animation:fadeUp .3s ease both}

/* COMPONENTES */
.sec-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.panel{background:var(--surface);border:1px solid var(--border);padding:22px 26px;margin-bottom:16px}
.field-lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);display:block;margin-bottom:8px;font-weight:600}
.input-f{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:14px;padding:11px 14px;outline:none;transition:border-color .2s;font-family:var(--fu);color-scheme:dark;line-height:1.5}
.input-f:focus{border-color:var(--gold-dim)}
.input-f::placeholder{color:var(--muted)}
.textarea-f{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:14px;line-height:1.7;padding:12px 14px;resize:vertical;min-height:120px;outline:none;transition:border-color .2s;font-family:var(--fu)}
.textarea-f:focus{border-color:var(--gold-dim)}
.textarea-f::placeholder{color:var(--muted)}
.char-c{font-size:11px;color:var(--muted);text-align:right;margin-top:6px}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;background:var(--gold);color:#07070a;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:none;cursor:pointer;transition:all .2s;font-family:var(--fu)}
.btn-primary:hover{background:var(--amber)}
.btn-primary:disabled{background:var(--border2);color:var(--muted);cursor:not-allowed}
.btn-ghost{padding:10px 18px;background:transparent;border:1px solid var(--border2);color:var(--muted2);font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;font-family:var(--fu);font-weight:600}
.btn-ghost:hover{border-color:var(--gold-dim);color:var(--gold)}
.btn-sm{padding:5px 12px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;font-family:var(--fu);font-weight:600}
.btn-sm:hover,.btn-sm.active{border-color:var(--gold-dim);color:var(--gold);background:rgba(201,168,76,.05)}
.btn-danger{padding:6px 12px;background:transparent;border:1px solid var(--red);color:var(--red);font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;font-family:var(--fu);font-weight:600}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-left:2px solid var(--gold-dim);background:rgba(201,168,76,.04);margin-bottom:16px}
.notice p{font-size:13px;line-height:1.6}
.notice-warn{border-color:#7a4a00;background:rgba(245,158,11,.04)}
.notice-ok{border-color:var(--green);background:rgba(74,222,128,.05)}
.notice-err{border-color:var(--red);background:rgba(248,113,113,.05)}
.net-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.net-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .18s;position:relative}
.net-card.sel{border-color:var(--gold-dim);background:rgba(201,168,76,.04)}
.net-name-s{font-size:8px;color:var(--muted);text-align:center;line-height:1.2;font-weight:500}
.net-chk{position:absolute;top:3px;right:4px;font-size:7px;color:var(--gold);opacity:0;transition:opacity .15s}
.net-card.sel .net-chk{opacity:1}
.cg{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
@media(max-width:900px){.cg{grid-template-columns:1fr}}
.cg-side{position:sticky;top:20px}
.sel-count{font-family:var(--fd);font-size:40px;font-weight:400;color:var(--gold);line-height:1}
.sel-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.sel-list{display:flex;flex-direction:column;gap:5px;max-height:170px;overflow-y:auto}
.sel-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted2)}
.nets-settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.net-setting-card{background:var(--bg);border:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.net-setting-card.connected{border-color:var(--gold-dim);background:rgba(201,168,76,.03)}
.net-setting-header{display:flex;align-items:center;gap:10px}
.net-setting-name{font-size:12px;font-weight:600;color:var(--text)}
.net-setting-status{font-size:9px;letter-spacing:.5px;text-transform:uppercase}
.status-connected{color:var(--green)}
.status-disconnected{color:var(--muted)}
.net-setting-actions{display:flex;gap:5px}
.cred-form{background:var(--surface);border:1px solid var(--gold-dim);padding:24px;margin-bottom:16px;animation:fadeUp .2s ease both}
.cred-form-title{font-family:var(--fd);font-size:20px;font-weight:500;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.cred-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:600px){.cred-fields{grid-template-columns:1fr}}
.hist-item{padding:14px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.hist-item:last-child{border-bottom:none}
.hist-cap{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:6px}
.hist-tags{display:flex;flex-wrap:wrap;gap:4px}
.hist-tag{display:inline-flex;align-items:center;gap:4px;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:3px 7px;border:1px solid var(--border2);color:var(--muted2)}
.hist-meta{text-align:right}
.hist-date{font-size:10px;color:var(--muted)}
.badge{display:inline-block;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;margin-bottom:4px}
.badge-pub{background:rgba(74,222,128,.08);color:#4ade80;border:1px solid #4ade8030}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(6px)}
.modal{background:var(--surface);border:1px solid var(--border2);width:90%;max-width:420px;padding:28px;box-shadow:0 40px 100px rgba(0,0,0,.8);animation:fadeUp .2s ease}
.modal-title{font-family:var(--fd);font-size:24px;font-weight:500;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--muted2);margin-bottom:18px;line-height:1.5}
.modal-plats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px;padding:12px;background:var(--bg);border:1px solid var(--border)}
.plat-pill{display:inline-flex;align-items:center;gap:5px;font-size:8px;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border:1px solid;font-weight:700}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn-ghost{flex:1}
.modal-actions .btn-primary{flex:2}
.result-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.result-row:last-child{border-bottom:none}
.result-name{flex:1;color:var(--muted2)}
.result-ok{color:var(--green);font-size:10px}
.result-err{color:var(--red);font-size:10px}
.pub-state{text-align:center;padding:24px 0}
.spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
.audience-btn{padding:7px 13px;background:transparent;border:1px solid var(--border);color:var(--muted2);font-size:10px;cursor:pointer;font-family:var(--fu);transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.audience-btn:hover{border-color:var(--border2);color:var(--text)}
.audience-btn.active{background:rgba(201,168,76,.12);border-color:var(--gold-dim);color:var(--gold)}
.media-tab{padding:7px 13px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:10px;cursor:pointer;font-family:var(--fu);transition:all .2s}
.media-tab:hover{color:var(--text)}
.media-tab.active{border-color:var(--gold-dim);color:var(--gold);background:rgba(201,168,76,.08)}
.drop-zone{border:2px dashed var(--border2);padding:24px;text-align:center;cursor:pointer;transition:all .2s;color:var(--muted)}
.drop-zone:hover{border-color:var(--gold-dim);color:var(--gold)}
</style>

function tr(k){ return (T[state.lang] || T.pt)[k] || k; }
function setState(p){ Object.assign(state, p); render(); }
function icon(id, color, size){
  size = size || 22;
  return '<span style="display:inline-flex;width:'+size+'px;height:'+size+'px;flex-shrink:0;color:'+color+'">'+(SVG[id]||'')+'</span>';
}
function convertUrl(url){
  url = (url||'').trim();
  var dm = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(dm) return 'https://drive.google.com/uc?export=download&id='+dm[1];
  var dm2 = url.match(/drive\.google\.com\/open\?id=([^&]+)/);
  if(dm2) return 'https://drive.google.com/uc?export=download&id='+dm2[1];
  if(url.indexOf('dropbox.com') > -1){
    url = url.replace('dl=0','dl=1');
    if(url.indexOf('dl=') < 0) url += (url.indexOf('?') > -1 ? '&' : '?') + 'dl=1';
  }
  return url;
}

// ══ AUTH ═══════════════════════════════════════════════════════════
function doAuth(){
  var email = state.authEmail, pass = state.authPassword, name = state.authName;
  if(!email || !pass){ setState({authError:tr('email')+' e '+tr('password')+' são obrigatórios.'}); return; }
  setState({authError:''});
  var ep = state.authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
  var body = state.authMode === 'login' ? {email:email,password:pass} : {name:name||email.split('@')[0],email:email,password:pass};
  fetch(API+ep, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res){
      if(!res.ok) throw new Error(res.d.error || 'Erro');
      localStorage.setItem('pat_token', res.d.token);
      localStorage.setItem('pat_user', JSON.stringify(res.d.user));
      setState({token:res.d.token, user:res.d.user, screen:'app', tab:'compose', authError:''});
      loadConnections();
    })
    .catch(function(e){ setState({authError:e.message}); });
}
function doLogout(){
  localStorage.removeItem('pat_token'); localStorage.removeItem('pat_user');
  setState({token:null, user:null, screen:'landing', authEmail:'', authPassword:'', authName:''});
}
function doGoogleLogin(){ window.location.href = API+'/api/auth/google'; }

function loadConnections(){
  if(!state.token) return;
  fetch(API+'/api/creds', {headers:{'Authorization':'Bearer '+state.token}})
    .then(function(r){ return r.json(); })
    .then(function(d){
      var map = {};
      (d.connections||[]).forEach(function(c){ map[c.platform] = c; });
      state.connections = map;
      render();
    }).catch(function(e){ console.error(e); });
}
function saveCreds(platform){
  setState({netSaving:true, netError:'', netSuccess:''});
  fetch(API+'/api/creds/'+platform, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},
    body:JSON.stringify(state.netForm)
  }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res){
      if(!res.ok) throw new Error(res.d.error || 'Erro ao salvar');
      loadConnections();
      setState({netSaving:false, netSuccess:tr('testOk'), editingNet:null, netForm:{}});
    }).catch(function(e){ setState({netSaving:false, netError:e.message}); });
}
function deleteCreds(platform){
  if(!confirm(tr('disconnect')+' '+platform+'?')) return;
  fetch(API+'/api/creds/'+platform, {method:'DELETE',headers:{'Authorization':'Bearer '+state.token}})
    .then(function(){ loadConnections(); })
    .catch(function(e){ console.error(e); });
}

// savePreferences definida acima

function loadPreferences(){
  if(!state.token) return;
  fetch(API+'/api/user/preferences', {
    headers:{'Authorization':'Bearer '+state.token}
  }).then(function(r){ return r.json(); })
    .then(function(d){
      var prefs = d.preferences || {};
      var changed = false;
      if(prefs.audience_profile){
        state.audienceProfile = prefs.audience_profile;
        changed = true;
      }
      if(prefs.preferred_networks && prefs.preferred_networks.length > 0){
        state.selected = new Set(prefs.preferred_networks);
        changed = true;
      }
      if(prefs.language){
        state.lang = prefs.language;
        changed = true;
      }
      if(changed) render();
      console.log('[PostAllTon] Preferências carregadas:', prefs);
    }).catch(function(e){ console.warn('[PostAllTon] Preferências não carregadas:', e.message); });
}

function savePreferences(){
  if(!state.token) return;
  var nets = [...state.selected];
  fetch(API+'/api/user/preferences', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},
    body:JSON.stringify({
      preferredNetworks: nets,
      audienceProfile:   state.audienceProfile || null,
      language:          state.lang,
    })
  }).then(function(r){ return r.json(); })
    .then(function(d){ console.log('[PostAllTon] Preferências salvas!'); })
    .catch(function(e){ console.warn('[PostAllTon] Erro ao salvar preferências:', e.message); });
}

function applyAudience(id){
  var p = AUDIENCE.find(function(a){ return a.id === id; });
  if(!p) return;
  if(p.id === 'all'){
    state.selected = new Set(NETS.map(function(n){ return n.id; }));
  } else {
    var connected = Object.keys(state.connections);
    var suggested = p.nets.filter(function(n){ return connected.indexOf(n) > -1; });
    state.selected = new Set(suggested.length > 0 ? suggested : p.nets);
  }
  state.audienceProfile = id;
  render();
  // Salvar preferência automaticamente
  savePreferences();
}

// ══ PUBLISH ════════════════════════════════════════════════════════
function publishPost(){
  if(!state.token || !state.caption.trim() || !state.selected.size) return;
  setState({modal:'publishing'});
  var body = {caption:state.caption, platforms:[...state.selected]};
  var ma = state.mediaUrls.split(',').map(function(s){ return convertUrl(s.trim()); }).filter(Boolean);
  if(ma.length) body.mediaUrls = ma;
  if(state.schedDate) body.scheduleDate = new Date(state.schedDate).toISOString();
  fetch(API+'/api/post', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},
    body:JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res){
      if(!res.ok) throw new Error(res.d.error || 'HTTP error');
      var results = {};
      (res.d.postIds||[]).forEach(function(p){ results[p.platform] = {ok:true,url:p.postUrl}; });
      (res.d.errors||[]).forEach(function(e){ results[e.platform] = {ok:false,msg:e.message}; });
      var np = {id:Date.now(),caption:state.caption,networks:[...state.selected],date:new Date().toLocaleString(),status:'publicado'};
      setState({modal:'done', modalResults:results, posts:[np].concat(state.posts), caption:'', mediaUrls:'', schedDate:''});
    }).catch(function(e){ setState({modal:'error', modalError:e.message}); });
}
function checkout(provider, plan, billing){
  if(!state.token){ setState({screen:'auth',authMode:'register'}); return; }
  var ep = provider === 'stripe' ? '/api/payment/stripe/checkout' : '/api/payment/mp/checkout';
  fetch(API+ep, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},
    body:JSON.stringify({plan:plan, billingType:billing})
  }).then(function(r){ return r.json(); })
    .then(function(d){ if(d.checkoutUrl) window.location.href = d.checkoutUrl; else throw new Error(d.error||'Erro'); })
    .catch(function(e){ alert('Erro: '+e.message); });
}

      '<button class="btn-ghost" onclick="setTab(\'compose\')">'+tr('createFirst')+'</button></div>' :
      '<div class="panel">'+state.posts.map(function(p){
        return '<div class="hist-item">'+
          '<div><p class="hist-cap">'+(p.caption.length>130?p.caption.slice(0,130)+'…':p.caption)+'</p>'+
          '<div class="hist-tags">'+(p.networks||[]).slice(0,8).map(function(nid){
            var n = NETS.find(function(x){ return x.id===nid; });
            return '<span class="hist-tag" style="border-color:'+(n?n.color+'33':'var(--border2)')+'">'+icon(nid,n?n.color:'var(--muted2)',11)+'<span style="color:'+(n?n.color:'var(--muted2)')+'">'+( n?n.name:nid)+'</span></span>';
          }).join('')+((p.networks||[]).length>8?'<span class="hist-tag">+'+(p.networks.length-8)+'</span>':'')+'</div></div>'+
          '<div class="hist-meta"><span class="badge badge-pub">'+p.status+'</span><div class="hist-date">'+p.date+'</div></div></div>';
      }).join('')+'</div>');
}

// ══ MODAL ══════════════════════════════════════════════════════════
function modalView(){
  var m = state.modal;
  var selNets = NETS.filter(function(n){ return state.selected.has(n.id); });
  return '<div class="modal-bg" onclick="if(event.target===this&&\''+m+'\'!==\'publishing\')setState({modal:null})">'+
    '<div class="modal">'+
    (m==='confirm' ?
      '<div class="modal-title">'+tr('confirmTitle')+'</div>'+
      // Preview da legenda
      (state.caption ? '<div style="background:var(--bg);border:1px solid var(--border);padding:12px;margin-bottom:12px;font-size:13px;color:var(--text);line-height:1.6;max-height:80px;overflow:hidden">'+state.caption.slice(0,120)+(state.caption.length>120?'…':'')+'</div>' : '')+
      // Preview de mídia
      (state.mediaUrls ? (function(){
        var urls = state.mediaUrls.split(',').map(function(u){return u.trim();}).filter(Boolean);
        var firstUrl = urls[0]||'';
        var isImg = /\.(jpg|jpeg|png|gif|webp)/i.test(firstUrl) || firstUrl.indexOf('picsum')>-1 || firstUrl.indexOf('drive.google')>-1;
        return isImg ?
          '<div style="margin-bottom:12px;border:1px solid var(--border);overflow:hidden;max-height:140px"><img src="'+firstUrl+'" style="width:100%;object-fit:cover;max-height:140px" onerror="this.style.display='none'"/></div>' :
          '<div style="background:var(--bg);border:1px solid var(--border);padding:8px 12px;margin-bottom:12px;font-size:11px;color:var(--muted2)">📎 '+urls.length+' arquivo(s) de mídia</div>';
      })() : '')+
      // Data de agendamento
      (state.schedDate ? '<div style="background:rgba(245,158,11,.08);border:1px solid #f59e0b33;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--amber);display:flex;align-items:center;gap:8px"><span style="font-size:16px">📅</span><div><div style="font-weight:600">'+tr('scheduledFor')+'</div><div>'+new Date(state.schedDate).toLocaleString(state.lang==='pt'?'pt-BR':state.lang==='es'?'es-ES':state.lang==='fr'?'fr-FR':'en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})+'</div></div></div>' : '')+
      '<div class="modal-sub" style="margin-bottom:10px">'+tr('confirmSub')+' <strong style="color:var(--gold)">'+selNets.length+'</strong> '+tr('confirmSub2')+'</div>'+
      '<div class="modal-plats">'+selNets.map(function(n){ return '<span class="plat-pill" style="border-color:'+n.color+'44;color:'+n.color+'">'+icon(n.id,n.color,12)+'<span>'+n.name+'</span></span>'; }).join('')+'</div>'+
      '<div class="modal-actions"><button class="btn-ghost" onclick="setState({modal:null})">'+tr('cancelBtn')+'</button><button class="btn-primary" onclick="publishPost()">'+(state.schedDate?tr('scheduleIn'):tr('publishBtn'))+'</button></div>' :
    m==='publishing' ?
      '<div class="pub-state"><div class="spinner"></div><div style="font-family:var(--fd);font-size:22px;margin-bottom:5px">'+tr('publishing')+'</div><div style="font-size:11px;color:var(--muted)">'+tr('publishingSub')+' '+selNets.length+' redes</div></div>' :
    m==='done' ?
      '<div class="modal-title" style="color:var(--gold)">'+tr('publishedTitle')+'</div>'+
      '<div class="modal-sub">'+tr('publishedSub')+'</div>'+
      '<div style="border-top:1px solid var(--border);margin-bottom:18px">'+
      selNets.map(function(n){
        var r = state.modalResults[n.id];
        return '<div class="result-row">'+icon(n.id,n.color,15)+'<span class="result-name">'+n.name+'</span>'+
          (r&&r.ok ? (r.url?'<a href="'+r.url+'" target="_blank" style="color:var(--gold);font-size:10px">'+tr('seePost')+'</a>':'<span class="result-ok">✓ '+tr('published')+'</span>') : '<span class="result-err">✗ '+(r&&r.msg?r.msg:tr('sent'))+'</span>')+
          '</div>';
      }).join('')+'</div>'+
      '<button class="btn-primary" onclick="setState({modal:null})">'+tr('closeBtn')+'</button>' :
      '<div class="modal-title" style="color:var(--red)">'+tr('errorTitle')+'</div>'+
      '<div class="notice notice-err" style="margin-bottom:12px"><p><strong>'+state.modalError+'</strong></p></div>'+
      '<p style="font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6">'+tr('errorHint')+'</p>'+
      '<div class="modal-actions"><button class="btn-ghost" onclick="setState({modal:null})">'+tr('closeBtn')+'</button><button class="btn-primary" onclick="setState({modal:\'confirm\'})">'+tr('retryBtn')+'</button></div>'
    )+'</div></div>';
}

// ══ HANDLERS ═══════════════════════════════════════════════════════
function setTab(t){ state.tab = t; if(t==='settings') loadConnections(); render(); }
function setLang(l){ state.lang = l; render(); savePreferences(); }
function selectAll(){ state.selected = new Set(NETS.map(function(n){ return n.id; })); render(); }
function selectNone(){ state.selected = new Set(); render(); }
function toggleNet(id){
  var s = new Set(state.selected);
  s.has(id) ? s.delete(id) : s.add(id);
  state.selected = s;
  var el = document.querySelector('.net-card[data-id="'+id+'"]');
  if(el){
    var isSel = s.has(id);
    el.classList.toggle('sel', isSel);
    var sp = el.querySelectorAll('span')[1];
    if(sp){ var n = NETS.find(function(x){ return x.id===id; }); if(n) sp.style.color = isSel?n.color:(state.connections[id]?n.color+'88':'var(--muted)'); }
  }
  window._canPublish = !!state.token && state.caption.trim() && s.size > 0;
  var cnt = document.getElementById('selCount'); if(cnt) cnt.textContent = s.size;
  var btn = document.getElementById('publishBtn');
  if(btn){ btn.disabled = !window._canPublish; btn.textContent = '◈ '+(state.schedDate?tr('scheduleIn'):tr('publishNow'))+' '+s.size+' '+(s.size===1?tr('platform'):tr('platforms2')); }
  var sl = document.getElementById('selList');
  if(sl){
    var selNets = NETS.filter(function(n){ return s.has(n.id); });
    sl.innerHTML = selNets.length===0 ? '<p style="font-size:11px;color:var(--muted)">'+tr('none')+'</p>' :
      selNets.map(function(n){ return '<div class="sel-item">'+icon(n.id,n.color,14)+'<span>'+n.name+'</span>'+(state.connections[n.id]?'<span style="color:var(--green);font-size:8px;margin-left:auto">●</span>':'<span style="color:var(--muted);font-size:8px;margin-left:auto">○</span>')+'</div>'; }).join('');
  }
  // Salvar preferências automaticamente após mudança
  clearTimeout(window._savePrefTimeout);
  window._savePrefTimeout = setTimeout(function(){ savePreferences(); }, 800);
}
function onCaption(v){
  state.caption = v;
  window._canPublish = !!state.token && v.trim() && state.selected.size > 0;
  var cc = document.getElementById('charCount'); if(cc) cc.textContent = v.length+' / 2200 '+tr('chars');
  var pt = document.getElementById('prevText');
  if(pt) pt.innerHTML = v ? '<p style="font-size:13px;color:var(--text);line-height:1.6;word-break:break-word">'+v.slice(0,160)+(v.length>160?'…':'')+'</p>' : '<p style="font-size:12px;color:var(--muted);font-style:italic">'+tr('previewEmpty')+'</p>';
  var btn = document.getElementById('publishBtn');
  if(btn){ btn.disabled = !window._canPublish; btn.textContent = '◈ '+(state.schedDate?tr('scheduleIn'):tr('publishNow'))+' '+state.selected.size+' '+(state.selected.size===1?tr('platform'):tr('platforms2')); }
}
function onSched(v){
  state.schedDate = v;
  var sl = document.getElementById('schedLbl');
  if(sl) sl.innerHTML = v ? '<p style="font-size:11px;color:var(--amber);margin-top:6px">'+tr('scheduledFor')+': '+new Date(v).toLocaleString()+'</p>' : '';
}
function onMediaConvert(v){
  var urls = v.split(',').map(function(u){ return convertUrl(u.trim()); }).filter(Boolean);
  state.mediaUrls = urls.join(', ');
  render();
}
function onFileUpload(input){
  var file = input.files[0];
  if(!file) return;
  state.mediaUrls = file.name;
  alert(tr('uploadHint'));
  render();
}
function toggleEdit(id){
  if(state.editingNet === id){ setState({editingNet:null,netForm:{},netError:'',netSuccess:''}); }
  else { setState({editingNet:id,netForm:{},netError:'',netSuccess:''}); }
}
function openModal(){ setState({modal:'confirm'}); }

// ══ GOOGLE CALLBACK ════════════════════════════════════════════════
(function(){
  var p = new URLSearchParams(window.location.search);
  var tk = p.get('token'), us = p.get('user');
  if(tk){
    localStorage.setItem('pat_token',tk);
    if(us){ try{ localStorage.setItem('pat_user',decodeURIComponent(us)); }catch(e){} }
    state.token = tk;
    try{ state.user = JSON.parse(decodeURIComponent(us||'null')); }catch(e){}
    state.screen = 'app';
    window.history.replaceState({},'','/');
  }
  var err = p.get('error');
  if(err){ state.screen = 'auth'; state.authError = decodeURIComponent(err); }
  var payment = p.get('payment');
  if(payment === 'success'){
    alert('✅ Pagamento confirmado! Plano '+(p.get('plan')||'')+' ativado.');
    window.history.replaceState({},'','/');
  }
})();

// ══ BILLING TOGGLE ════════════════════════════════════════════════
window.setBilling = function(b){
  state.billing = b;
  render();
};

// ══ INIT ═══════════════════════════════════════════════════════════
window._canPublish = false;
render();
if(state.token){
  loadConnections();
  loadPreferences();
}
</script>
</body>
</html>
